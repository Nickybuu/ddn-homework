<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ระบบเช็คงานและมอบหมายงาน (ครู)</title>
<!--
  หน้าครูฝังใน GitHub ไม่ได้ (Deploy แบบ Only myself ต้องล็อกอิน Google ซึ่ง Safari/iPhone บล็อกในกรอบ iframe)
  หน้านี้จึงพาไปเปิดลิงก์ /exec ตรง ๆ แทน · ทำครั้งเดียว: วางลิงก์ /exec ของหน้าครูในบรรทัด APP_URL
  ปลอดภัย: ใครได้ลิงก์ไปก็เปิดไม่ได้ ถ้าไม่ได้ล็อกอินด้วยบัญชีของครู
-->
<style>
body{margin:0;background:#f2f4f7;color:#0f1218;font:16px/1.6 'Sarabun','Noto Sans Thai','Thonburi',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:40px 16px}
a.b{display:block;text-align:center;padding:14px;border-radius:8px;background:#141414;color:#fff;text-decoration:none;font-weight:600;margin-top:16px}
p{color:#5a6270;margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1 style="font-size:20px;margin:0">ระบบเช็คงานและมอบหมายงาน</h1>
<p id="t">กำลังเปิดหน้าเว็บครู...</p>
<a class="b" id="go" href="#">เปิดหน้าเว็บครู</a>
<p>ต้องล็อกอินด้วยบัญชี Google ของครูเจ้าของชีต</p>
</main>
<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbyTf7bzGgKVkCNRjFcNzig_NovshJKHamf87PXMnZBNmvl-HAQFUq-3gpzj01hhV9t-sg/exec';
(function () {
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL);
  if (!ok) { document.getElementById('t').textContent = 'ยังไม่ได้ใส่ลิงก์ /exec ของหน้าครู (APP_URL ในไฟล์ index.html)'; document.getElementById('go').hidden = true; return; }
  document.getElementById('go').href = APP_URL;
  location.replace(APP_URL);
})();
</script>
</body>
</html>
