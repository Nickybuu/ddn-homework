<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตรวจสอบการส่งงาน · โรงเรียนดัดดรุณี</title>
<!--
  หน้านี้เป็นแค่ "กรอบ" ที่เปิดเว็บตรวจงานค้างส่งจาก Apps Script (โค้ดและข้อมูลจริงอยู่ที่ Apps Script ที่เดียว)
  ทำครั้งเดียว: วางลิงก์ /exec ของเว็บนักเรียน (Deploy แบบ Anyone) ในบรรทัด APP_URL ข้างล่าง แล้วอัปโหลดไฟล์นี้ขึ้น GitHub
  แก้โค้ดใน Apps Script ภายหลัง → New version → หน้านี้อัปเดตตามเอง ไม่ต้องแก้ไฟล์นี้
-->
<style>
html,body{margin:0;height:100%;background:#fff;font-family:'Sarabun','Noto Sans Thai','Thonburi',system-ui,sans-serif}
iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
#msg{padding:24px 16px;max-width:560px;margin:0 auto;line-height:1.6;color:#1c2422}
#msg a{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:12px;background:#1c2422;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div id="msg" hidden></div>
<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbywFJRl1KwVs26qY_opmhuln7UxmzvE5Wv4Mb3tPonPGI7A_yOgHnN-8-dvkmsHAMvK4w/exec';
(function () {
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL);
  var m = document.getElementById('msg');
  if (!ok) {
    m.hidden = false;
    m.textContent = 'ยังไม่ได้ใส่ลิงก์เว็บตรวจงาน (APP_URL ในไฟล์ index.html ต้องเป็นลิงก์ https://script.google.com/macros/s/.../exec)';
    return;
  }
  var f = document.createElement('iframe');
  f.src = APP_URL;
  f.title = 'ระบบตรวจสอบการส่งงาน';
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
})();
</script>
<noscript><p style="padding:16px">เปิดหน้านี้ไม่ได้ กรุณาเปิด JavaScript</p></noscript>
</body>
</html>
